spring.application.name=escale-app

# --- Base de donnees ---
# Par defaut : H2 en memoire (developpement local / demo)
# En production/CI, surcharger via variables d'environnement pour pointer vers PostgreSQL :
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/escale_db
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>  (a definir via un secret, jamais en dur)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:escaledb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2 utile en local (a desactiver en production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Serveur ---
server.port=8080

# --- Actuator (healthcheck pour Docker/Kubernetes) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
