stages:
  - build
  - test
  - security

# 1. Build : Compilation et création du package
build-job:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar

# 2. Test : Exécution des tests unitaires
test-job:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn test

# 3. Security : Scan de vulnérabilités (Préparation)
security-scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 1 --severity CRITICAL .
  allow_failure: true # On autorise l'échec pour le moment, le temps de configurer
